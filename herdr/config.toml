[theme]
name = "catppuccin"
auto_switch = false

[keys]
prefix = "ctrl+f"

reload_config = "prefix+."
detach = "prefix+d"

# Agents
focus_agent = "prefix+shift+1..9"

# Workspaces
workspace_picker = "prefix+shift+l"
rename_workspace = "prefix+shift+r"
new_workspace = "prefix+shift+n"
close_workspace = "prefix+shift+x"

# Tabs
new_tab = "prefix+n"
switch_tab = "prefix+1..9"
goto = "prefix+l"
close_tab = "prefix+shift+q"
rename_tab = "prefix+r"
move_tab_previous = "prefix+shift+comma"
move_tab_next = "prefix+shift+period"

# Panes
split_vertical = "prefix+h"
split_horizontal = "prefix+v"
close_pane = "prefix+q"
focus_pane_left = "prefix+left"
focus_pane_down = "prefix+down"
focus_pane_up = "prefix+up"
focus_pane_right = "prefix+right"
swap_pane_left = "prefix+shift+left"
swap_pane_down = "prefix+shift+down"
swap_pane_up = "prefix+shift+up"
swap_pane_right = "prefix+shift+right"

[terminal]
new_cwd = "follow"

[advanced]
scrollback_lines = 10000

[ui]
mouse_capture = true
tab_bar_position = "top"
tab_bar_right = [{ type = "datetime", format = "%I:%M:%S%p %d-%m-%Y" }]
agent_panel_sort = "spaces"
