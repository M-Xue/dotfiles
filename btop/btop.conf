#? Config file for btop
#
# btop rewrites this file on exit, so install_ubuntu.sh copies it rather than
# symlinking it - a symlink would have btop editing this repo. Only the values
# that differ from btop's defaults are kept here.

#* Matched by stem against ~/.config/btop/themes and the binary's theme dir.
color_theme = "catppuccin_macchiato"

#* Use the theme's background rather than the terminal's.
theme_background = True

truecolor = True
